<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf8">
  <meta name="description" content="A little message from IAN to you.">
  <title>IAN to YOU</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center;
      padding: 24px; background: #fffaf8; color: #272322;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(100%, 520px); text-align: center; padding: 36px 24px; }
    .heart { font-size: 28px; margin-bottom: 22px; animation: float 2.4s ease-in-out infinite; }
    .eyebrow { color: #9a7772; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(38px, 10vw, 58px); margin: 14px 0 24px; letter-spacing: -.04em; }
    .rule { width: 42px; height: 1px; background: #d9bdb7; margin: 0 auto 28px; }
    .message { font-family: Georgia, "Times New Roman", serif; font-size: clamp(21px, 5.2vw, 27px); line-height: 1.65; }
    .signature { margin-top: 34px; color: #9a7772; font-size: 13px; letter-spacing: .12em; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @media (prefers-reduced-motion: reduce) { .heart { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="heart" aria-hidden="true">🤍</div>
    <div class="eyebrow">a little message for you</div>
    <h1>IAN to YOU</h1>
    <div class="rule"></div>
    <p class="message">Shawty, you got to be cancer cause you make me feel some type way 🤧❤️</p>
    <div class="signature">— IAN</div>
  </main>
</body>
</html>
